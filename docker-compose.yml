services:
  # HOST FLOW (pull-only, no build needed):
  #   cp secrets.env.example secrets.env   # once, fill in keys
  #   docker compose pull && docker compose up -d
  # CI/LOCAL BUILD FLOW (fallback, uses build section below):
  #   docker compose up -d --build
  app:
    image: codexis/genai-prompt-game:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    ports:
      - "3001:3001"
    env_file:
      - path: ./secrets.env
        required: false
    # Shared cookie-signing key: every replica must see the same value or
    # admin sessions created on one are rejected on the others. Generate once
    # (openssl rand -hex 32) and put it in secrets.env as ADMIN_SECRET.
    # RUST_LOG defaults to info; set e.g. debug for per-request tracing.
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Pinned here (beats env_file) so a stale relative DATABASE_URL in a
      # local secrets.env cannot pull the db back onto the overlay.
      DATABASE_URL: sqlite:/data/server.sqlite3?mode=rwc
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    # Host logs: `docker compose logs app` reads the json-file driver
    # below (rotated 5 x 10M per container, no ./logs dir needed).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

volumes:
  sqlite_data:
