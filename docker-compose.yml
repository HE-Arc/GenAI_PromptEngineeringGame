services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    env_file:
      - path: ./server/.env
        required: false
    volumes:
      - sqlite_data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Reachable name inside the compose network; falls back to localhost outside Docker.
      AXUM_URL: http://server:3001
    depends_on:
      - server

volumes:
  sqlite_data:
