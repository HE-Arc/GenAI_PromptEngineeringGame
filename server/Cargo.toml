[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
async-openai = "0.26"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
axum-test = "=16"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
tower = { version = "0.5", features = ["util"] }
